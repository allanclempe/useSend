name: unsend-dev

services:
  # Neon Local proxies to the Neon branch in NEON_BRANCH_ID. NEON_PROJECT_ID,
  # NEON_API_KEY and NEON_BRANCH_ID come from .envrc via direnv.
  #
  # Neon Local can also create a branch per git branch by reading .git/HEAD,
  # but that mount is deliberately absent: .git is a file, not a directory, in
  # a git worktree, so the bind fails there. BRANCH_ID pins the branch instead.
  postgres:
    image: neondatabase/neon_local:v1.5
    container_name: use-send-db
    restart: unless-stopped
    environment:
      DRIVER: serverless
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:?set NEON_PROJECT_ID in .envrc}
      NEON_API_KEY: ${NEON_API_KEY:?set NEON_API_KEY in .envrc}
      DELETE_BRANCH: "false"
      BRANCH_ID: ${NEON_BRANCH_ID:?set NEON_BRANCH_ID in .envrc}
    ports:
      # 54320 was the old postgres:16 dev port; kept so DATABASE_URL and the
      # docs do not have to change. Plain 5432 collides with other Neon Local
      # containers running on this machine.
      - "54320:5432"
    volumes:
      - ./.neon_local:/tmp/.neon_local

  redis:
    image: redis:7
    container_name: unsend-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    command: ["redis-server", "--maxmemory-policy", "noeviction"]

  local-sen-sns:
    image: usesend/local-ses-sns:latest
    container_name: local-ses-sns
    restart: always
    ports:
      - "5350:3000"
    environment:
      WEBHOOK_URL: http://host.docker.internal:3000/api/ses_callback
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio:
    image: minio/minio
    container_name: unsend-storage-dev
    ports:
      - 9002:9002
      - 9001:9001
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: unsend
      MINIO_ROOT_PASSWORD: password
    entrypoint: sh
    command: -c 'mkdir -p /data/unsend && minio server /data --console-address ":9001" --address ":9002"'

volumes:
  redis:
  minio:
