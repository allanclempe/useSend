packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  keytar: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260916.0-alpha || 5.20260917.0-alpha
  - wrangler@4.133.0 || 4.134.0
  - '@cloudflare/vite-plugin@1.55.0'
  - '@cloudflare/workerd-darwin-64@1.20260917.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260917.1'
  - '@cloudflare/workerd-linux-64@1.20260917.1'
  - '@cloudflare/workerd-linux-arm64@1.20260917.1'
  - '@cloudflare/workerd-windows-64@1.20260917.1'
  - workerd@1.20260917.1

# This file is the only place pnpm reads settings from. The `"pnpm"` field in
# root package.json used to carry a second copy "for deployment environments
# still on pnpm 9"; pnpm 11 ignores that field outright, so the copy was inert
# and a security override lived somewhere edits had no effect (issue #55). Both
# deployment paths resolve pnpm from `packageManager` via corepack —
# `docker/Dockerfile` and `nixpacks.toml` — so neither was ever on pnpm 9.
#
# `linkify-it@<=5.0.0` is a security floor. It matches nothing today (the tree
# resolves 5.0.2, already above the vulnerable range); it is here so a future
# resolution cannot fall back into it.
#
# `lightningcss` is an optional peer of `vite`, so pnpm builds one `vite`
# instance per distinct resolution of it. The tree had two — `vitest` on
# 1.33.0, `@tanstack/react-start` on 1.32.0 — which means two structurally
# identical but nominally different copies of vite's `Plugin` and `UserConfig`
# types. `vitest.config.ts` passes a plugin from one into `defineConfig` from
# the other, so whether `tsc` accepts it depends on which copy it happens to
# anchor first, and that depends on the order files enter the program. Deleting
# `src/app` and the tRPC routers (#9) changed that order and turned a latent
# mismatch into six errors in files the change never touched.
#
# Pinning it collapses the two `vite` instances into one, which is the actual
# fix: the configs are then typed against a single copy no matter the file
# order.
overrides:
  "linkify-it@<=5.0.0": "5.0.1"
  "pnpm@<11.11.0": "11.11.0"
  lightningcss: "1.33.0"

# `@hookform/resolvers` imports `zod` without declaring a dependency or a peer
# on it, so it resolved to whatever happened to be hoisted. That was zod 3 until
# better-auth (issue #8) added zod 4 to the tree and won the hoist, which
# retyped every `zodResolver(...)` call in the app against the wrong major.
# Both workspace consumers are on zod 3; this states that rather than leaving it
# to hoist order.
packageExtensions:
  "@hookform/resolvers":
    dependencies:
      zod: "^3.24.3"
